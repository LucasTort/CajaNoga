<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CAJA NOGA — Control de ganancias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#14171a;
    --surface:#1d2126;
    --surface-2:#262b32;
    --border:#31373f;
    --text:#edeff2;
    --text-dim:#8b93a1;
    --accent:#ff2b2b;
    --accent-dim:#7a1414;
    --profit:#3ecf8e;
    --profit-dim:#1f5b41;
    --danger:#ff6b6b;
    --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(255,43,43,0.09), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:32px;
  }

  /* header */
  header{
    padding:20px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand-block{display:flex; flex-direction:column; gap:4px;}
  .brand-logo{
    height:30px;
    width:auto;
    display:block;
  }
  .brand-sub{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--profit);
    box-shadow:0 0 6px var(--profit);
  }

  /* tabs */
  .tabs{
    display:flex;
    padding:14px 20px 0;
    gap:8px;
  }
  .tab-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:10px 0;
    border-radius:var(--radius);
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn.active{
    background:var(--surface-2);
    color:var(--accent);
    border-color:var(--accent-dim);
  }

  main{
    flex:1;
    padding:18px 20px 0;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .view{display:none; flex-direction:column; gap:18px;}
  .view.active{display:flex;}

  /* form card */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
  }
  .card-title{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{border-color:var(--accent);}
  .field input::placeholder{color:#565d67;}
  .field input[type="date"]{color-scheme:dark;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}

  .live-ganancia{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:14px;
  }
  .live-ganancia .lbl{font-size:12px; color:var(--text-dim);}
  .live-ganancia .val{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .val.pos{color:var(--profit);}
  .val.neg{color:var(--danger);}
  .val.zero{color:var(--text-dim);}

  .btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    border:none;
    border-radius:6px;
    padding:12px 0;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{filter:brightness(0.95);}

  .btn-danger{
    width:100%;
    background:transparent;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12.5px;
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 0;
    cursor:pointer;
    transition:all .15s ease;
    margin-top:4px;
  }
  .btn-danger:hover{
    color:var(--danger);
    border-color:var(--danger);
  }

  /* entries list */
  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .entries-list{display:flex; flex-direction:column; gap:8px;}
  .entry{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .entry-main{flex:1; min-width:0;}
  .entry-model{
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-detail{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:3px;
  }
  .entry-gain{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    color:var(--profit);
    white-space:nowrap;
  }
  .entry-gain.neg{color:var(--danger);}
  .entry-del{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .entry-del:hover{color:var(--danger);}

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:20px 10px;
    border:1px dashed var(--border);
    border-radius:var(--radius);
  }

  /* odometer */
  .odometer-wrap{
    background:linear-gradient(180deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 16px 16px;
    text-align:center;
  }
  .odometer-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .odometer{
    display:flex;
    justify-content:center;
    gap:3px;
    flex-wrap:wrap;
  }
  .digit{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:26px;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    background:#0f1114;
    border:1px solid var(--accent-dim);
    border-radius:4px;
    width:26px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-shadow:0 0 8px rgba(255,43,43,0.55);
  }
  .digit.sep{
    background:transparent;
    border:none;
    width:10px;
    color:var(--text-dim);
    text-shadow:none;
    font-size:20px;
  }
  .digit.currency{
    background:transparent;
    border:none;
    color:var(--text-dim);
    text-shadow:none;
    font-size:20px;
    width:16px;
  }

  /* historial filter */
  .filter-row{display:flex; gap:8px;}
  .filter-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:9px 0;
    border-radius:6px;
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--profit-dim);
    color:var(--profit);
    border-color:var(--profit);
  }

  .daylist{display:flex; flex-direction:column; gap:6px;}
  .day-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .day-date{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    width:64px;
    flex-shrink:0;
  }
  .day-bar-track{
    flex:1;
    height:6px;
    background:var(--surface-2);
    border-radius:3px;
    overflow:hidden;
  }
  .day-bar-fill{
    height:100%;
    background:var(--profit);
    border-radius:3px;
  }
  .day-total{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:12.5px;
    color:var(--text);
    width:78px;
    text-align:right;
    flex-shrink:0;
  }

  .loading-state{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:40px 0;
  }

  ::selection{background:var(--accent-dim); color:var(--text);}
</style>
</head>

      <div>
        <div class="section-label" style="margin-bottom:8px;">Por día</div>
        <div class="daylist" id="dayList"></div>
      </div>

      <button class="btn-danger" id="btnReset">Vaciar caja</button>

    </div>

  </main>
</div>

<script>
(function(){
  var entries = [];
  var loaded = false;
  var currentTab = 'hoy';
  var currentFilter = 'semana';

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function fmt(n){
    var neg = n < 0;
    var s = Math.abs(Math.round(n)).toLocaleString('es-AR');
    return (neg?'-':'') + '$ ' + s;
  }

  function setStatus(ok){
    var dot = document.getElementById('statusDot');
    dot.style.background = ok ? 'var(--profit)' : 'var(--danger)';
    dot.style.boxShadow = ok ? '0 0 6px var(--profit)' : '0 0 6px var(--danger)';
  }

  // ---- FIREBASE ----
  var firebaseConfig = {
    apiKey: "AIzaSyCmYOZvZaZVK5-HvaZFkhkK-LJ4ML5lqWg",
    authDomain: "caja-noga.firebaseapp.com",
    databaseURL: "https://caja-noga-default-rtdb.firebaseio.com",
    projectId: "caja-noga",
    storageBucket: "caja-noga.firebasestorage.app",
    messagingSenderId: "705660736605",
    appId: "1:705660736605:web:f3626d7028c5134758e9b4"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var entriesRef = db.ref('entries');

  // Escucha en tiempo real: cualquier carga de cualquier persona actualiza a todos al instante
  entriesRef.on('value', function(snapshot){
    var val = snapshot.val();
    entries = val ? Object.keys(val).map(function(key){
      var e = val[key];
      e.id = key;
      return e;
    }) : [];
    loaded = true;
    setStatus(true);
    renderAll();
  }, function(error){
    setStatus(false);
    console.error('Firebase error:', error);
  });

  function addEntry(modelo, costo, precio, gastos, costoEmpleado, fecha){
    var ganancia = precio - costo - gastos - costoEmpleado;
    entriesRef.push({
      date: fecha || todayStr(),
      modelo: modelo,
      costo: costo,
      precio: precio,
      gastos: gastos,
      costoEmpleado: costoEmpleado,
      ganancia: ganancia
    }).catch(function(){ setStatus(false); });
    // No hace falta renderAll() acá: el listener 'value' de Firebase
    // se dispara solo apenas se guarda y actualiza la pantalla.
  }

  function deleteEntry(id){
    entriesRef.child(id).remove().catch(function(){ setStatus(false); });
  }

  // ---- ODOMETER ----
  function renderOdometer(container, amount){
    container.innerHTML = '';
    var neg = amount < 0;
    var digitsStr = Math.abs(Math.round(amount)).toLocaleString('es-AR');
    var curr = document.createElement('div');
    curr.className = 'digit currency';
    curr.textContent = neg ? '-$' : '$';
    container.appendChild(curr);
    for(var i=0;i<digitsStr.length;i++){
      var ch = digitsStr[i];
      var el = document.createElement('div');
      if(ch === '.'){
        el.className = 'digit sep';
        el.textContent = '.';
      }else{
        el.className = 'digit';
        el.textContent = ch;
      }
      container.appendChild(el);
    }
  }

  // ---- HOY VIEW ----
  function renderToday(){
    var td = todayStr();
    var todays = entries.filter(function(e){ return e.date === td; });
    var list = document.getElementById('entriesToday');
    list.innerHTML = '';
    if(todays.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Todavía no cargaste trabajos hoy';
      list.appendChild(empty);
    }else{
      todays.slice().reverse().forEach(function(e){
        var row = document.createElement('div');
        row.className = 'entry';
        var neg = e.ganancia < 0;
        row.innerHTML =
          '<div class="entry-main">'+
            '<div class="entry-model"></div>'+
            '<div class="entry-detail"></div>'+
          '</div>'+
          '<div class="entry-gain'+(neg?' neg':'')+'"></div>'+
          '<button class="entry-del" aria-label="Eliminar">✕</button>';
        row.querySelector('.entry-model').textContent = e.modelo || 'Sin modelo';
        var detailText = fmt(e.costo) + ' → ' + fmt(e.precio);
        if(e.gastos && e.gastos > 0){ detailText += '  ·  gastos ' + fmt(e.gastos); }
        if(e.costoEmpleado && e.costoEmpleado > 0){ detailText += '  ·  empleado ' + fmt(e.costoEmpleado); }
        row.querySelector('.entry-detail').textContent = detailText;
        row.querySelector('.entry-gain').textContent = (neg?'':'+') + fmt(e.ganancia);
        row.querySelector('.entry-del').addEventListener('click', function(){ deleteEntry(e.id); });
        list.appendChild(row);
      });
    }
    var total = todays.reduce(function(s,e){ return s + e.ganancia; }, 0);
    renderOdometer(document.getElementById('odometerToday'), total);
  }

  function updateLiveGanancia(){
    var costo = parseFloat(document.getElementById('inCosto').value) || 0;
    var precio = parseFloat(document.getElementById('inPrecio').value) || 0;
    var gastos = parseFloat(document.getElementById('inGastos').value) || 0;
    var costoEmpleado = parseFloat(document.getElementById('inCostoEmpleado').value) || 0;
    var g = precio - costo - gastos - costoEmpleado;
    var el = document.getElementById('liveGanancia');
    el.textContent = fmt(g);
    el.className = 'val ' + (g > 0 ? 'pos' : (g < 0 ? 'neg' : 'zero'));
  }

  // ---- HISTORIAL VIEW ----
  function toDateStr(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function currentWeekRange(){
    var d = new Date();
    var dow = d.getDay(); // 0=domingo, 1=lunes ... 6=sabado
    var diffToMonday = (dow === 0) ? -6 : (1 - dow);
    var monday = new Date(d);
    monday.setDate(d.getDate() + diffToMonday);
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { start: toDateStr(monday), end: toDateStr(sunday) };
  }

  function filterEntries(filter){
    if(filter === 'todo') return entries.slice();
    if(filter === 'semana'){
      var range = currentWeekRange();
      return entries.filter(function(e){ return e.date >= range.start && e.date <= range.end; });
    }
    if(filter === 'mes'){
      var now = new Date();
      var prefix = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
      return entries.filter(function(e){ return e.date.slice(0,7) === prefix; });
    }
    return entries.slice();
  }

  function renderHistorial(){
    var filtered = filterEntries(currentFilter);
    var byDay = {};
    filtered.forEach(function(e){
      byDay[e.date] = (byDay[e.date] || 0) + e.ganancia;
    });
    var days = Object.keys(byDay).sort().reverse();
    var total = filtered.reduce(function(s,e){ return s + e.ganancia; }, 0);

    var labelMap = {
      semana: 'Acumulado — semana (lun a dom)',
      mes: 'Acumulado — este mes',
      todo: 'Acumulado — histórico'
    };
    document.getElementById('histLabel').textContent = labelMap[currentFilter];
    renderOdometer(document.getElementById('odometerHist'), total);

    var maxAbs = Math.max.apply(null, days.map(function(d){ return Math.abs(byDay[d]); }).concat([1]));
    var listEl = document.getElementById('dayList');
    listEl.innerHTML = '';
    if(days.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No hay trabajos cargados en este período';
      listEl.appendChild(empty);
      return;
    }
    days.forEach(function(d){
      var val = byDay[d];
      var pct = Math.max(4, Math.round((Math.abs(val)/maxAbs)*100));
      var parts = d.split('-');
      var shortDate = parts[2]+'/'+parts[1];
      var row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML =
        '<div class="day-date"></div>'+
        '<div class="day-bar-track"><div class="day-bar-fill" style="width:'+pct+'%; background:'+(val<0?'var(--danger)':'var(--profit)')+';"></div></div>'+
        '<div class="day-total"></div>';
      row.querySelector('.day-date').textContent = shortDate;
      row.querySelector('.day-total').textContent = fmt(val);
      listEl.appendChild(row);
    });
  }

  function renderAll(){
    if(!loaded) return;
    renderToday();
    renderHistorial();
  }

  // ---- EVENTS ----
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById('view-'+currentTab).classList.add('active');
    });
  });

  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderHistorial();
    });
  });

  document.getElementById('inCosto').addEventListener('input', updateLiveGanancia);
  document.getElementById('inPrecio').addEventListener('input', updateLiveGanancia);
  document.getElementById('inGastos').addEventListener('input', updateLiveGanancia);
  document.getElementById('inCostoEmpleado').addEventListener('input', updateLiveGanancia);

  document.getElementById('btnReset').addEventListener('click', function(){
    if(entries.length === 0){
      alert('La caja ya está vacía.');
      return;
    }
    var ok1 = confirm('¿Vaciar la caja? Esto borra TODOS los trabajos cargados (de todos), para siempre.');
    if(!ok1) return;
    var ok2 = confirm('Confirmá de nuevo: no se puede deshacer. ¿Vaciar igual?');
    if(!ok2) return;
    entriesRef.remove().catch(function(){ setStatus(false); });
  });

  document.getElementById('btnAdd').addEventListener('click', function(){
    var modeloEl = document.getElementById('inModelo');
    var fechaEl = document.getElementById('inFecha');
    var costoEl = document.getElementById('inCosto');
    var precioEl = document.getElementById('inPrecio');
    var gastosEl = document.getElementById('inGastos');
    var costoEmpleadoEl = document.getElementById('inCostoEmpleado');
    var modelo = modeloEl.value.trim();
    var fecha = fechaEl.value || todayStr();
    var costo = parseFloat(costoEl.value);
    var precio = parseFloat(precioEl.value);
    var gastos = parseFloat(gastosEl.value) || 0;
    var costoEmpleado = parseFloat(costoEmpleadoEl.value) || 0;
    if(!modelo){ modeloEl.focus(); return; }
    if(isNaN(costo) || isNaN(precio)){ return; }
    addEntry(modelo, costo, precio, gastos, costoEmpleado, fecha);
    if(fecha !== todayStr()){
      alert('Cargado para el ' + fecha.split('-').reverse().join('/') + '. Lo vas a ver en la pestaña Historial.');
    }
    modeloEl.value = '';
    costoEl.value = '';
    precioEl.value = '';
    gastosEl.value = '';
    costoEmpleadoEl.value = '';
    fechaEl.value = todayStr();
    updateLiveGanancia();
    modeloEl.focus();
  });

  document.getElementById('inFecha').value = todayStr();
})();
</script>
</body>
</html>
